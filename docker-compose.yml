version: "3.9"

services:
  # ─── PostgreSQL + PostGIS ────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: propriete_db
    environment:
      POSTGRES_DB: propriete_graph
      POSTGRES_USER: propriete
      POSTGRES_PASSWORD: propriete
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propriete -d propriete_graph"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis (cache + task queue) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: propriete_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Backend API ─────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propriete_api
    environment:
      DATABASE_URL: postgresql+asyncpg://propriete:propriete@db:5432/propriete_graph
      DATABASE_URL_SYNC: postgresql://propriete:propriete@db:5432/propriete_graph
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - dvfdata:/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Celery Worker (async tasks) ─────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propriete_worker
    command: celery -A api.tasks worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://propriete:propriete@db:5432/propriete_graph
      DATABASE_URL_SYNC: postgresql://propriete:propriete@db:5432/propriete_graph
      REDIS_URL: redis://redis:6379/0
    volumes:
      - dvfdata:/data
      - ./backend:/app
    depends_on:
      - api
      - redis

  # ─── DVF Data Ingestion (one-shot) ──────────────────────
  dvf-ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propriete_dvf_ingestion
    command: python -m data_pipeline.dvf_ingestion 2022 2023
    environment:
      DATABASE_URL: postgresql://propriete:propriete@db:5432/propriete_graph
      DEPARTMENTS: "75,69,13,33,31,06,59,67,44,34"
    volumes:
      - dvfdata:/data
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - ingest

  # ─── Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: propriete_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

  # ─── Nginx reverse proxy ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: propriete_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    profiles:
      - production

volumes:
  pgdata:
  redisdata:
  dvfdata:
